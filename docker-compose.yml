services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hms-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - hms-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hms-worker
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - hms-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

  db:
    image: mysql:8.0
    container_name: hms-db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - hms-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: hms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./backend/public:/var/www/html/public:ro
      - hms-storage:/var/www/html/storage:ro
    depends_on:
      - app

volumes:
  hms-db-data:
  hms-storage: