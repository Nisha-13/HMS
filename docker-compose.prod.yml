services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hms-app-prod
    restart: unless-stopped
    working_dir: /var/www/html

    env_file:
      - .env.production

    environment:
      DB_HOST: db
      DB_PORT: 3306

    volumes:
      - hms-storage-prod:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy


  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hms-worker-prod
    restart: unless-stopped
    working_dir: /var/www/html

    env_file:
      - .env.production

    environment:
      DB_HOST: db
      DB_PORT: 3306

    volumes:
      - hms-storage-prod:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90


  db:
    image: mysql:8.0
    container_name: hms-db-prod
    restart: unless-stopped

    env_file:
      - .env.production

    volumes:
      - hms-db-data-prod:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10


  nginx:
    image: nginx:alpine
    container_name: hms-nginx-prod
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./backend/public:/var/www/html/public:ro
      - hms-storage-prod:/var/www/html/storage:ro

    depends_on:
      - app


volumes:
  hms-db-data-prod:
  hms-storage-prod: